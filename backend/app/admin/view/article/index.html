{extend name='table'}

{block name="button"}
<!--{if auth("add")}-->
<button data-modal='{:url("add")}' data-title="添加文章" class='layui-btn layui-btn-sm layui-btn-primary'>添加文章</button>
<!--{/if}-->
<!--{if auth("remove")}-->
<a data-confirm="确定要删除选中的文章吗？" data-table-id="ArticleTable" data-action='{:url("remove")}' data-rule="id#{id}" class='layui-btn layui-btn-sm layui-btn-primary'>批量删除</a>
<!--{/if}-->
{/block}

{block name="content"}
<div class="layui-card">
    <div class="layui-card-body">
        <table id="ArticleTable" data-url="{:sysuri('index')}"></table>
    </div>
</div>

<script>
    $(function () {
        $('#ArticleTable').layTable({
            even: true, height: 'full',
            sort: {field: 'sort desc,id', type: 'desc'},
            cols: [[
                {checkbox: true, fixed: true},
                {field: 'sort', title: '排序', width: 90, align: 'center', sort: true, templet: '#SortInputTpl'},
                {
                    field: 'cover', title: '封面', width: 80, align: 'center', templet: function (d) {
                        if (!d.cover) return '-';
                        return layui.laytpl('<div class="headimg headimg-ss" data-tips-image data-lazy-src="{{d.cover}}"></div>').render(d);
                    }
                },
                {field: 'title', title: '文章标题', minWidth: 200, templet: '<div>{{d.title||"-"}}</div>'},
                {field: 'tags', title: '标签', minWidth: 120, align: 'center', templet: '<div>{{d.tags||"-"}}</div>'},
                {field: 'num_read', title: '阅读量', width: 90, align: 'center', sort: true},
                {field: 'status', title: '状态', align: 'center', width: 110, templet: '#StatusSwitchTpl'},
                {field: 'create_at', title: '创建时间', align: 'center', width: 150, sort: true},
                {toolbar: '#toolbar', title: '操作', align: 'center', minWidth: 140, fixed: 'right'}
            ]]
        });

        // 状态切换
        layui.form.on('switch(StatusSwitch)', function (obj) {
            var data = {id: obj.value, status: obj.elem.checked > 0 ? 1 : 0};
            $.form.load("{:url('state')}", data, 'post', function (ret) {
                $('#ArticleTable').trigger('reload');
                return false;
            }, false);
        });
    });
</script>

<!-- 状态切换模板 -->
<script type="text/html" id="StatusSwitchTpl">
    <!--{if auth("state")}-->
    <input type="checkbox" value="{{d.id}}" lay-skin="switch" lay-text="已上架|已下架" lay-filter="StatusSwitch" {{-d.status>0?'checked':''}}>
    <!--{else}-->
    {{-d.status ? '<b class="color-green">已上架</b>' : '<b class="color-red">已下架</b>'}}
    <!--{/if}-->
</script>

<!-- 排序模板 -->
<script type="text/html" id="SortInputTpl">
    <input type="number" min="0" data-blur-number="0" data-action-blur="{:sysuri()}" data-value="id#{{d.id}};action#sort;sort#{value}" data-loading="false" value="{{d.sort}}" class="layui-input text-center">
</script>

<!-- 操作模板 -->
<script type="text/html" id="toolbar">
    <!--{if auth("edit")}-->
    <a class="layui-btn layui-btn-sm" data-title="编辑文章" data-modal='{:url("edit")}?id={{d.id}}'>编 辑</a>
    <!--{/if}-->
    <!--{if auth("remove")}-->
    <a class="layui-btn layui-btn-sm layui-btn-danger" data-confirm="确定要删除吗？" data-action="{:url('remove')}" data-value="id#{{d.id}}">删 除</a>
    <!--{/if}-->
</script>
{/block}
